<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>每日打卡</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#1f2d33;--sub:#6b7c85;--line:#e3e9ec;--accent:#2f6f62;--accent-soft:#e8f2ef;--warn:#b7604f}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 1px 2px rgba(31,45,51,.05),0 8px 24px rgba(31,45,51,.05)}
.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:21px;margin-bottom:14px}
h1{font-size:19px;margin:0 0 6px}p{color:var(--sub);font-size:13px;margin:0 0 16px}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
input[type=password]{font:inherit;font-size:15px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
button{font:inherit;font-size:14px;width:100%;margin-top:12px;padding:11px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
#msg{font-size:12px;margin:12px 0 0;min-height:18px}
#msg.err{color:var(--warn)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--sub)}
summary{cursor:pointer;color:var(--accent);font-weight:600}
details p{margin:8px 0 0;font-size:12px;line-height:1.7}
#app[hidden]{display:none}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="mark">◈</div>
    <h1>每日打卡</h1>
    <p>本站内容以密文存储。请输入访问口令，页面会在本机浏览器解密后显示，口令不会上传。</p>
    <label for="pwd">访问口令</label>
    <input id="pwd" type="password" autocomplete="off" spellcheck="false" placeholder="请输入口令">
    <button id="go" type="button">解锁</button>
    <p id="msg"></p>
    <details>
      <summary>说明</summary>
      <p>解密使用 PBKDF2-SHA256（20 万次）+ AES-256-GCM，全部在本机完成。服务器、仓库与任何第三方都只保存密文，没有找回口令的后门；口令丢失后已加密的记录无法恢复。</p>
      <p>请通过 HTTPS 打开本站；浏览器的加密接口在非安全上下文下不可用。</p>
    </details>
  </div>
</div>
<div id="app" hidden></div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var msg = $('#msg'), btn = $('#go'), pwd = $('#pwd');
  var meta = null;

  function b64d(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function say(text, isErr) { msg.textContent = text; msg.className = isErr ? 'err' : ''; }
  function injectScript(code) {
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  }

  function show(bundle) {
    $('#app').innerHTML = bundle.html;
    var st = document.createElement('style');
    st.textContent = bundle.css;
    document.head.appendChild(st);
    injectScript(bundle.core);
    injectScript(bundle.sync);
    injectScript(bundle.app);
    $('#gate').remove();
    $('#app').hidden = false;
  }

  function unlock() {
    var pass = pwd.value;
    if (!pass) { say('请先输入口令', true); return; }
    if (!window.crypto || !window.crypto.subtle) {
      say('当前环境不支持加密接口，请用 HTTPS 打开本站', true); return;
    }
    btn.disabled = true; say('正在解密…');
    var enc = new TextEncoder();
    var p1 = crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    p1.then(function (base) {
      var common = { name: 'PBKDF2', hash: 'SHA-256', iterations: meta.iter };
      return Promise.all([
        crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', iterations: meta.iter, salt: b64d(meta.salt) },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']),
        crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', iterations: meta.iter, salt: enc.encode(meta.vaultSalt) },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt'])
      ]).then(function (keys) { return { base: base, bundleKey: keys[0], vaultKey: keys[1], common: common }; });
    }).then(function (k) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(meta.iv) }, k.bundleKey, b64d(meta.ct))
        .then(function (buf) {
          var bundle = JSON.parse(new TextDecoder().decode(buf));
          window.__VAULT_KEY__ = k.vaultKey;
          show(bundle);
        });
    }).catch(function () {
      btn.disabled = false;
      say('口令不正确，或数据已损坏。请重试。', true);
    });
  }

  btn.addEventListener('click', unlock);
  pwd.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });

  fetch('data.enc.json?_=' + Date.now()).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (m) {
    meta = m;
    say('已就绪，请输入口令');
    pwd.focus();
  }).catch(function () {
    say('无法读取加密数据包，请刷新页面重试', true);
    btn.disabled = true;
  });
})();
</script>
</body>
</html>
